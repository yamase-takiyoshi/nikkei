name: Build offline industry atlas

on:
  workflow_dispatch:
  push:
    paths:
      - 'industry-atlas/build.py'
      - 'industry-atlas/template.html'
      - '.github/workflows/update-industry-atlas.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd requests

      - name: Build self-contained atlas
        run: python industry-atlas/build.py

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industry-atlas/index.html industry-atlas/offline.html industry-atlas/companies.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build offline industry atlas [skip ci]"
            git push
          fi
