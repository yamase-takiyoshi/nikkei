name: Fix company master fallback

"on":
  push:
    paths:
      - ".github/workflows/fix-company-master-fallback.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          original = text

          if "const BUILTIN_COMPANY_MASTER =" not in text:
              anchor = "mergeCompanyMasterSeed();\n\n/* 企業一覧の自己修復："
              insert = "mergeCompanyMasterSeed();\n\n/* 内蔵企業マスターの独立スナップショット。状態データが空でも必ずここから復元する。 */\nconst BUILTIN_COMPANY_MASTER = companyData.map(c=>JSON.parse(JSON.stringify(c)));\n\n/* 企業一覧の自己修復："
              if anchor not in text:
                  raise SystemExit("snapshot anchor not found")
              text = text.replace(anchor, insert, 1)

          old = "  for(const base of companyData){"
          new = "  for(const base of BUILTIN_COMPANY_MASTER){"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("master loop anchor not found")

          old = "let dashboardState = {marketData,bondYields,stockData,commodityData,inflationData,bankRates,companyData,candlestickData,economicNews,historyData,policyInfo};"
          new = "let dashboardState = {marketData,bondYields,stockData,commodityData,inflationData,bankRates,companyData:BUILTIN_COMPANY_MASTER.map(cloneCompanyRecord),candlestickData,economicNews,historyData,policyInfo};"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("dashboard state anchor not found")

          old = '''function filteredCompanies(){
  const q=$("companySearch")?.value||"";
  const nq=normalizeCompanyText(q);
  const ind=$("industryFilter")?.value||"";
  return (dashboardState.companyData||[]).filter(c=>{'''
          new = '''function filteredCompanies(){
  const q=$("companySearch")?.value||"";
  const nq=normalizeCompanyText(q);
  const ind=$("industryFilter")?.value||"";
  if(!Array.isArray(dashboardState.companyData) || dashboardState.companyData.length===0){
    dashboardState.companyData=BUILTIN_COMPANY_MASTER.map(cloneCompanyRecord);
  }
  return dashboardState.companyData.filter(c=>{'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("filteredCompanies anchor not found")

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("patched")
          else:
              print("already patched")
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden company master fallback"
          git push
