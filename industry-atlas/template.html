<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本企業 業界図鑑 2026</title>
<style>
:root{--b:#0756a6;--b2:#0a88c2;--y:#ffe000;--g:#0a9d79;--ink:#17344d;--mut:#667b90;--line:#d7e3ec;--bg:#edf3f7}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,#063667,#0756a6);color:#fff;padding:9px 10px;box-shadow:0 2px 12px #0003;z-index:20}.brand{font-weight:950}.brand small{opacity:.65;margin-left:7px}.btn{border:1px solid #ffffff38;background:#ffffff15;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}.btn.yellow{background:var(--y);color:#17344d;border-color:var(--y)}.btn.green{background:var(--g)}.sp{flex:1}.work{display:grid;grid-template-columns:310px 1fr;min-height:0}.side{background:#fff;border-right:1px solid var(--line);padding:12px;overflow:auto}.box{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.box h3{margin:0;padding:9px 10px;font-size:12px;background:#f5f8fb}.box .in{padding:10px}.big{font-size:30px;font-weight:950;color:var(--b)}.small{font-size:10px;line-height:1.5;color:var(--mut)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border:1px solid #dbe6ee;border-radius:9px;padding:8px;background:#f8fbfd}.stat b{display:block;font-size:18px}.nav{display:grid;gap:2px;max-height:40vh;overflow:auto}.nav button{border:0;background:transparent;text-align:left;padding:6px 7px;border-radius:7px;font-size:10px}.nav button.on{background:#e4f1fb;color:var(--b);font-weight:900}.stagewrap{overflow:auto;background:radial-gradient(circle at 50% 18%,#fff,#e7eef4 60%)}.stage{min-width:1010px;min-height:800px;padding:38px;display:flex;justify-content:center;align-items:flex-start}.page{width:960px;height:720px;background:#fff;box-shadow:0 18px 50px #17344d2b;position:relative;overflow:hidden;flex:none}.pi{height:100%;padding:38px 42px}.topline{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--b),#19bad0,var(--y))}.kicker{font-size:10px;color:var(--b);font-weight:950;letter-spacing:.12em}.title{font-size:34px;line-height:1.07;font-weight:950;letter-spacing:-.04em;margin:6px 0 10px}.lead{font-size:14px;line-height:1.7;color:#5d7287}.foot{position:absolute;left:42px;bottom:14px;font-size:8px;color:#8495a5}.pageno{position:absolute;right:28px;bottom:14px;font-size:9px;color:#8495a5}.cover{background:linear-gradient(145deg,#03346d,#0756a6 52%,#0d8fc0);color:#fff}.cover .kicker{color:#ffeb51}.cover h1{font-size:72px;line-height:.95;letter-spacing:-.06em;margin:88px 0 15px}.cover h1 em{font-style:normal;color:var(--y)}.cover .sub{font-size:25px;font-weight:900}.badge{position:absolute;right:45px;top:40px;width:178px;height:178px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#fffde7 0 54%,#ffd840 55% 64%,#d6a208 65% 69%,transparent 70%);color:#17344d}.badge b{font-size:27px;color:#d3294e}.covergrid{position:absolute;left:48px;right:48px;bottom:48px;background:#fff;color:#18344d;display:grid;grid-template-columns:repeat(4,1fr);border-radius:14px;overflow:hidden}.covergrid div{padding:12px;border-right:1px solid #dbe5ed}.covergrid div:last-child{border:0}.covergrid b{display:block;font-size:17px;color:var(--b)}.covergrid small{font-size:8px;color:#6f8193}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.card{border:1px solid #d9e5ed;border-radius:10px;padding:9px;background:#f8fbfd}.card b{font-size:10px;display:block}.card strong{font-size:19px;color:var(--b);display:block;margin:3px 0}.card small{font-size:8px;color:#6f8193}.indhead{display:flex;justify-content:space-between;border-bottom:3px solid var(--b2);padding-bottom:9px}.indtitle{font-size:34px;font-weight:950}.num{font-size:58px;font-weight:950;line-height:.85;color:#dce9f4}.pills{display:flex;gap:5px;margin-top:5px}.pill{font-size:8px;padding:4px 7px;border-radius:99px;background:#e8f4fb;color:var(--b);font-weight:900}.flow{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;gap:4px;align-items:center;margin:14px 0}.node{padding:13px 7px;border-radius:10px;background:#edf6fb;border:1px solid #cfe0ed;text-align:center;font-size:10px;font-weight:900}.arr{text-align:center;color:#6897bb;font-size:20px}.companies{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cc{border:1px solid #dbe6ee;border-radius:8px;padding:6px 7px;min-height:43px}.cc b{font-size:9px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc span{font-size:7.5px;color:#6d8194}.mk{float:right;color:#0b896b!important;font-weight:900}.dir{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.dc{border:1px solid #d9e4ed;border-radius:8px;padding:7px;min-height:54px}.dc b{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc small{font-size:7.5px;color:#6e8193}.code{font-size:8px;color:var(--b);font-weight:900}.note{border:1px solid #d6e4ed;border-radius:12px;background:#f8fbfd;padding:12px;font-size:10px;line-height:1.6;color:#5e7286;margin-top:12px}.footerbar{height:29px;background:#fff;border-top:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:14px;font-size:10px;color:#64778b}.footerbar b{color:#17344d}.print{display:none}@media(max-width:850px){.work{grid-template-columns:1fr}.side{display:none}.stage{justify-content:flex-start;padding:16px}}@media print{.app{display:none!important}.print{display:block!important}.print .page{box-shadow:none;page-break-after:always;break-after:page;width:254mm;height:190.5mm}@page{size:254mm 190.5mm;margin:0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">日本企業 業界図鑑 <small>2026 / 完全オフライン版</small></div><button class="btn" id="prev">←</button><button class="btn" id="next">→</button><div class="sp"></div><span id="counter" style="font-size:11px"></span><button class="btn green" id="printBtn">印刷 / PDF</button><button class="btn" id="csvBtn">CSV保存</button><button class="btn yellow" id="htmlBtn">このオフライン版を保存</button></header>
<div class="work"><aside class="side"><div class="box"><h3>収録データ</h3><div class="in"><div class="big" id="companyCount"></div><div class="small">上場会社</div><div class="grid2" style="margin-top:8px"><div class="stat"><b id="industryCount"></b><span class="small">33業種</span></div><div class="stat"><b id="pageCount"></b><span class="small">総ページ</span></div></div><div class="note" id="sourceNote"></div></div></div><div class="box"><h3>企業検索</h3><div class="in"><input id="search" placeholder="会社名・証券コード" style="width:100%;border:1px solid #cddae5;border-radius:8px;padding:8px"><div id="hits" class="small" style="margin-top:7px"></div></div></div><div class="box"><h3>ページ</h3><div class="in"><div id="nav" class="nav"></div></div></div></aside><main class="stagewrap"><div class="stage"><div id="preview"></div></div></main></div><footer class="footerbar"><span>基礎データ <b id="baseDate"></b></span><span>基準日 <b id="asOf"></b></span><span>会社 <b id="footCompanies"></b>社</span></footer></div>
<div class="print" id="printArea"></div>
<script>
const DATA=__EMBEDDED_DATA__;
const S={companies:DATA.companies||[],pages:[],current:0};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const FLOW={'銀行業':['預金・資金','貸出・運用','企業・個人'],'証券、商品先物取引業':['投資家資金','仲介・引受','資本市場'],'保険業':['保険料','引受・運用','保障・保険金'],'医薬品':['研究・治験','承認・製造','医療機関・患者'],'輸送用機器':['部品・素材','開発・生産','販売・サービス'],'情報・通信業':['ネットワーク/データ','通信・ITサービス','個人・企業'],'建設業':['資材・人材','設計・施工','官公庁・企業・住宅'],'小売業':['メーカー・卸','店舗/EC','消費者'],'卸売業':['資源・メーカー','調達・物流・投資','産業・小売'],'電気機器':['素材・半導体','設計・製造','法人・消費者'],'機械':['部材','装置製造','工場・インフラ'],'食料品':['農水産・原料','加工・製造','小売・外食・家庭']};
const KPIS={'銀行業':['貸出金','利ざや','信用費用','預金'],'保険業':['保険料','損害率','運用利回り','自然災害'],'建設業':['受注高','手持工事','採算','人件費'],'情報・通信業':['契約/顧客数','クラウド/DX','開発費','人件費'],'輸送用機器':['世界販売台数','車種ミックス','電動化','為替'],'電気機器':['半導体需要','電子部品需要','設備投資','為替'],'小売業':['既存店売上','客数・客単価','粗利率','人件費'],'卸売業':['取扱高','商品市況','事業投資','為替'],'医薬品':['主力薬売上','新薬パイプライン','研究開発費','特許満了']};
function countBy(a,k){let o={};a.forEach(x=>{let v=x[k]||'未分類';o[v]=(o[v]||0)+1});return o}function chunks(a,n){let o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}function shortMarket(m){if((m||'').includes('プライム'))return'プライム';if((m||'').includes('スタンダード'))return'スタンダード';if((m||'').includes('グロース'))return'グロース';if((m||'').includes('PRO'))return'PRO';return m||'—'}
function base(inner,no,cls=''){return`<section class="page ${cls}"><div class="topline"></div><div class="pi">${inner}${cls==='cover'?'':`<div class="foot">日本企業 業界図鑑 2026 / ${esc(DATA.meta.asOf)}</div><div class="pageno">${no}</div>`}</div></section>`}
function cover(no){let n=S.companies.length;return base(`<div class="badge"><div><small>全上場企業</small><br><b>${n.toLocaleString()}社</b><br><small>収録</small></div></div><div class="kicker">図解でわかる！ 日本企業と業界の現在地</div><h1>日本企業<br><em>業界</em>図鑑</h1><div class="sub">企業と経済の今が<br>一冊でわかる！</div><div class="covergrid"><div><b>33業種</b><small>JPX公式分類</small></div><div><b>${n.toLocaleString()}社</b><small>企業索引</small></div><div><b>4:3</b><small>業界地図</small></div><div><b>2026</b><small>9月16日基準</small></div></div>`,no,'cover')}
function overview(no){let m=countBy(S.companies,'market');return base(`<div class="kicker">MARKET OVERVIEW</div><div class="title">日本の上場企業を俯瞰する</div><div class="lead">JPXの市場区分と公式33業種を基礎に、企業全体を整理します。</div><div class="cards">${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="card"><b>${esc(shortMarket(k))}</b><strong>${v.toLocaleString()}</strong><small>companies</small></div>`).join('')}</div><div class="note">ETF・ETN・REIT等は企業数から除外。基礎月末データに、2026年9月16日までの確認済み新規上場・上場廃止を補正しています。</div>`,no)}
function industry(no,p){let all=S.companies.filter(x=>x.industry33===p.key),f=FLOW[p.key]||['原料・人材・資本','製品・サービス','顧客・市場'],k=KPIS[p.key]||['売上高','利益率','販売・受注','外部環境'];return base(`<div class="indhead"><div><div class="kicker">INDUSTRY MAP / ${String(p.idx).padStart(2,'0')}</div><div class="indtitle">${esc(p.key)} <span style="font-size:10px;color:#718395">${p.part+1}/${p.total}</span></div><div class="pills"><span class="pill">${all.length}社</span></div></div><div class="num">${String(p.idx).padStart(2,'0')}</div></div><div class="cards">${k.map(x=>`<div class="card"><b>CHECK KPI</b><strong style="font-size:12px">${esc(x)}</strong></div>`).join('')}</div><div class="flow"><div class="node">${esc(f[0])}</div><div class="arr">→</div><div class="node">${esc(f[1])}</div><div class="arr">→</div><div class="node">${esc(f[2])}</div></div><div class="companies">${p.rows.map(c=>`<div class="cc"><span class="mk">${esc(shortMarket(c.market))}</span><b>${esc(c.name)}</b><span>${esc(c.code)}</span></div>`).join('')}</div>`,no)}
function directory(no,p){return base(`<div class="kicker">COMPANY INDEX</div><div class="title">全上場企業 索引</div><div class="dir">${p.rows.map(c=>`<div class="dc"><span class="code">${esc(c.code)} / ${esc(shortMarket(c.market))}</span><b>${esc(c.name)}</b><small>${esc(c.industry33)} / ${esc(c.industry17)}</small></div>`).join('')}</div>`,no)}
function sources(no){return base(`<div class="kicker">SOURCES</div><div class="title">出典・更新ルール</div><div class="note"><b>JPX 東証上場銘柄一覧</b><br>コード、銘柄名、市場区分、33業種、17業種、規模区分の基礎データ。</div><div class="note"><b>基準日補正</b><br>2026-09-16時点までに確認できた新規上場（618A、619A、621A）と上場廃止（3480、1909、2180）を反映。</div><div class="note"><b>架空値禁止</b><br>売上高、利益、時価総額などは推測で補完していません。個別財務ページを拡張する際はEDINET・各社IR等の一次資料を使用します。</div>`,no)}
function build(){let ps=[{t:'cover',name:'表紙'},{t:'overview',name:'市場全体'}],inds=Object.keys(countBy(S.companies,'industry33')).filter(x=>x&&x!=='未分類').sort((a,b)=>a.localeCompare(b,'ja'));inds.forEach((x,idx)=>{let rows=S.companies.filter(c=>c.industry33===x),parts=chunks(rows,48);parts.forEach((r,j)=>ps.push({t:'industry',name:`${x} ${j+1}/${parts.length}`,key:x,rows:r,part:j,total:parts.length,idx:idx+1}))});chunks(S.companies,24).forEach((r,j,a)=>ps.push({t:'directory',name:`企業索引 ${j+1}/${a.length}`,rows:r}));ps.push({t:'sources',name:'出典'});S.pages=ps;$('#companyCount').textContent=S.companies.length.toLocaleString();$('#industryCount').textContent=inds.length;$('#pageCount').textContent=ps.length;$('#footCompanies').textContent=S.companies.length.toLocaleString();$('#baseDate').textContent=DATA.meta.baseDate;$('#asOf').textContent=DATA.meta.asOf;$('#sourceNote').innerHTML=`基礎：${esc(DATA.meta.source)}<br>${esc(DATA.meta.baseDate)} → ${esc(DATA.meta.asOf)}補正済み`;nav();render()}
function nav(){let n=$('#nav');n.innerHTML=S.pages.map((p,i)=>`<button class="${i===S.current?'on':''}" data-i="${i}">${i+1}. ${esc(p.name)}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.current=+b.dataset.i;nav();render()})}
function pageHtml(p,i){if(p.t==='cover')return cover(i+1);if(p.t==='overview')return overview(i+1);if(p.t==='industry')return industry(i+1,p);if(p.t==='directory')return directory(i+1,p);return sources(i+1)}function render(){$('#preview').innerHTML=pageHtml(S.pages[S.current],S.current);$('#counter').textContent=`${S.current+1} / ${S.pages.length}`}function move(d){S.current=Math.max(0,Math.min(S.pages.length-1,S.current+d));nav();render()}
function download(text,type,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(){let h=['code','name','market','industry33','industry17','size'];let rows=S.companies.map(c=>h.map(k=>'"'+String(c[k]??'').replaceAll('"','""')+'"').join(','));download('\ufeff'+h.join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8','jpx_companies_2026-09-16.csv')}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#csvBtn').onclick=csv;$('#htmlBtn').onclick=()=>download('<!doctype html>\n'+document.documentElement.outerHTML,'text/html;charset=utf-8','日本企業業界図鑑_2026_完全オフライン.html');$('#printBtn').onclick=()=>{let a=$('#printArea');a.innerHTML=S.pages.map((p,i)=>pageHtml(p,i)).join('');setTimeout(()=>window.print(),100)};$('#search').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){$('#hits').innerHTML='';return}let h=S.companies.filter(c=>c.code.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)).slice(0,12);$('#hits').innerHTML=h.map(c=>`<div style="padding:4px 0;border-bottom:1px dotted #dce5ed"><b>${esc(c.code)} ${esc(c.name)}</b><br>${esc(c.industry33)} / ${esc(shortMarket(c.market))}</div>`).join('')||'該当なし'};
build();
</script>
</body></html>
